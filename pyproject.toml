[project]
name = "self-improving-agent"
version = "0.1.0"
description = "Autonomous self-improving conversational AI receptionist for healthcare appointment scheduling"
readme = "README.md"
authors = [
    { name = "vigneshwaran", email = "vigneshwarans1510@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["DTZ007", "DTZ005", "E501"]


